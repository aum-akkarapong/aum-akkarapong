<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="t d"><title id="t">Network Traffic Analyzer</title><desc id="d">Defensive monitoring platform: live capture, PCAP analysis and a detection dashboard, backed by a FastAPI service with SQLite or PostgreSQL storage. Stack: FastAPI, Scapy, PostgreSQL, React.</desc><style>text{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.sig{animation:sig 6s linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes sig{from{transform:translateX(-140px)}to{transform:translateX(600px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1a1d17" stroke-width=".6"/></pattern><pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".028"/></pattern><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#f5c842" stop-opacity="0"/><stop offset="1" stop-color="#f5c842"/></linearGradient><clipPath id="fr"><rect x="1" y="1" width="598" height="328" rx="12"/></clipPath></defs><rect x="1" y="1" width="598" height="328" rx="12" fill="#0b0f14" stroke="#34372b"/><g clip-path="url(#fr)"><rect x="0" y="44" width="600" height="330" fill="url(#g)" opacity=".55"/><path d="M0 43.5H600" stroke="#34372b"/><rect class="sig" x="0" y="42" width="140" height="2" fill="url(#sg)"/><circle class="pulse" cx="22" cy="22" r="4.5" fill="#f5c842"/><text x="36" y="27" font-size="13" fill="#747e89">~/lab/<tspan fill="#aab1b8">Network-Traffic-Analyzer</tspan></text><rect x="502" y="12" width="82" height="21" rx="3" fill="none" stroke="#6c6032"/><path d="M511 22v-2.5a4 4 0 0 1 8 0V22" fill="none" stroke="#f5c842" stroke-width="1.5"/><rect x="509" y="22" width="12" height="8" rx="1.5" fill="#f5c842"/><text x="527" y="27" font-size="11" fill="#f5c842" letter-spacing="1">PRIVATE</text><text x="26" y="80" font-size="13" fill="#6c6032" letter-spacing="2">PROJECT_02 · PYTHON</text><text x="26" y="112" font-size="27" font-weight="800" fill="#e9e8d9">Network Traffic Analyzer</text><rect x="26" y="124" width="54" height="3" fill="#f5c842"/><path d="M504 96H518L524 76L532 116L540 84L546 102L550 96H568" fill="none" stroke="#6c6032" stroke-width="2"/><path d="M504 96H518L524 76L532 116L540 84L546 102L550 96H568" fill="none" stroke="#f5c842" stroke-width="2.5" stroke-dasharray="18 120"><animate attributeName="stroke-dashoffset" from="0" to="-138" dur="2s" repeatCount="indefinite"/></path><text x="26" y="158" font-size="16" fill="#aab1b8">Defensive monitoring platform: live capture, PCAP</text><text x="26" y="182" font-size="16" fill="#aab1b8">analysis and a detection dashboard, backed by a</text><text x="26" y="206" font-size="16" fill="#aab1b8">FastAPI service with SQLite or PostgreSQL storage.</text><text x="26" y="248" font-size="13" fill="#f5c842" letter-spacing="1.5">▸ LIVE CAPTURE · PCAP · DETECTIONS</text><rect x="26" y="272" width="79" height="30" rx="4" fill="#0f141a" stroke="#2c3026"/><text x="65" y="292" font-size="13.5" fill="#e9e8d9" text-anchor="middle">FastAPI</text><rect x="112.69999999999999" y="272" width="62" height="30" rx="4" fill="#0f141a" stroke="#2c3026"/><text x="144" y="292" font-size="13.5" fill="#e9e8d9" text-anchor="middle">Scapy</text><rect x="183.2" y="272" width="103" height="30" rx="4" fill="#0f141a" stroke="#2c3026"/><text x="235" y="292" font-size="13.5" fill="#e9e8d9" text-anchor="middle">PostgreSQL</text><rect x="294.2" y="272" width="62" height="30" rx="4" fill="#0f141a" stroke="#2c3026"/><text x="325" y="292" font-size="13.5" fill="#e9e8d9" text-anchor="middle">React</text><rect width="600" height="330" fill="url(#sl)"/></g><path d="M7 19V7H19M581 7H593V19M593 311V323H581M19 323H7V311" fill="none" stroke="#6c6032" stroke-width="1.4"/></svg>