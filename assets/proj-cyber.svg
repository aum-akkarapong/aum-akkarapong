<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="t d"><title id="t">Cyber Security Learning</title><desc id="d">Interactive security curriculum: MDX lessons, flow diagrams, full-text search and an accessibility-tested interface. Stack: React, React Flow, Vitest, Playwright.</desc><style>text{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace}
