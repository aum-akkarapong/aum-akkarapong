<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.a{stroke-dasharray:420;stroke-dashoffset:420;animation:d 1s ease forwards}@keyframes d{to{stroke-dashoffset:0}}.f{opacity:0;animation:in .5s ease forwards}@keyframes in{to{opacity:1}}</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4fd1c5"/></marker></defs>
<rect x="1" y="1" width="1198" height="168" rx="12" fill="#0b0f14" stroke="#1f2a36"/>
