<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="t d"><title id="t">Network Engineer Hub</title><desc id="d">Network engineering curriculum with step-through animations and hands-on tools for addressing, subnetting and routing. Stack: Next.js, next-intl, Shiki, Python.</desc><style>text{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace}
