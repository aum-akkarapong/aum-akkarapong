<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="t d"><title id="t">NEXUS Network Explorer</title><desc id="d">Browser-based 3D digital twin of a factory network, with Pulse monitoring, MES, power systems and simulated device sessions down to the switch port. Stack: React Three Fiber, Zustand, Python, Docker.</desc><style>text{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.sig{animation:sig 6s linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes sig{from{transform:translateX(-140px)}to{transform:translateX(600px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1a1d17" stroke-width=".6"/></pattern><pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".028"/></pattern><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#f5c842" stop-opacity="0"/><stop offset="1" stop-color="#f5c842"/></linearGradient><clipPath id="fr"><rect x="1" y="1" width="598" height="328" rx="12"/></clipPath></defs><rect x="1" y="1" width="598" height="328" rx="12" fill="#0b0f14" stroke="#34372b"/><g clip-path="url(#fr)"><rect x="0" y="44" width="600" height="330" fill="url(#g)" opacity=".55"/><path d="M0 43.5H600" stroke="#34372b"/><rect class="sig" x="0" y="42" width="140" height="2" fill="url(#sg)"/><circle class="pulse" cx="22" cy="22" r="4.5" fill="#f5c842"/><text x="36" y="27" font-size="13" fill="#747e89">~/lab/<tspan fill="#aab1b8">nexus-network-explorer</tspan></text><rect x="502" y="12" width="82" height="21" rx="3" fill="none" stroke="#6c6032"/><path d="M511 22v-2.5a4 4 0 0 1 8 0V22" fill="none" stroke="#f5c842" stroke-width="1.5"/><rect x="509" y="22" width="12" height="8" rx="1.5" fill="#f5c842"/><text x="527" y="27" font-size="11" fill="#f5c842" letter-spacing="1">PRIVATE</text><text x="26" y="80" font-size="13" fill="#6c6032" letter-spacing="2">PROJECT_01 · TYPESCRIPT</text><text x="26" y="112" font-size="27" font-weight="800" fill="#e9e8d9">NEXUS Network Explorer</text><rect x="26" y="124" width="54" height="3" fill="#f5c842"/><path d="M504 116L536 104L568 116L536 128Z" fill="#0b0f14" stroke="#6c6032" stroke-width="1.5"><animate attributeName="stroke" values="#6c6032;#f5c842;#6c6032" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></path><path d="M504 103L536 91L568 103L536 115Z" fill="#0b0f14" stroke="#6c6032" stroke-width="1.5"><animate attributeName="stroke" values="#6c6032;#f5c842;#6c6032" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></path><path d="M504 90L536 78L568 90L536 102Z" fill="#0b0f14" stroke="#6c6032" stroke-width="1.5"><animate attributeName="stroke" values="#6c6032;#f5c842;#6c6032" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></path><path d="M504 77L536 65L568 77L536 89Z" fill="#0b0f14" stroke="#f5c842" stroke-width="1.5"><animate attributeName="stroke" values="#6c6032;#f5c842;#6c6032" dur="2.4s" begin="1.7999999999999998s" repeatCount="indefinite"/></path><text x="26" y="158" font-size="16" fill="#aab1b8">Browser-based 3D digital twin of a factory network,</text><text x="26" y="182" font-size="16" fill="#aab1b8">with Pulse monitoring, MES, power systems and</text><text x="26" y="206" font-size="16" fill="#aab1b8">simulated device sessions down to the switch port.</text><text x="26" y="248" font-size="13" fill="#f5c842" letter-spacing="1.5">▸ 4 FLOORS · 1,526 DEVICES · 8 PCB LINES</text><rect x="26" y="272" width="160" height="30" rx="4" fill="#0f141a" stroke="#2c3026"/><text x="106" y="292" font-size="13.5" fill="#e9e8d9" text-anchor="middle">React Three Fiber</text><rect x="193.7" y="272" width="79" height="30" rx="4" fill="#0f141a" stroke="#2c3026"/><text x="233" y="292" font-size="13.5" fill="#e9e8d9" text-anchor="middle">Zustand</text><rect x="280.4" y="272" width="71" height="30" rx="4" fill="#0f141a" stroke="#2c3026"/><text x="316" y="292" font-size="13.5" fill="#e9e8d9" text-anchor="middle">Python</text><rect x="359.0" y="272" width="71" height="30" rx="4" fill="#0f141a" stroke="#2c3026"/><text x="394" y="292" font-size="13.5" fill="#e9e8d9" text-anchor="middle">Docker</text><rect width="600" height="330" fill="url(#sl)"/></g><path d="M7 19V7H19M581 7H593V19M593 311V323H581M19 323H7V311" fill="none" stroke="#6c6032" stroke-width="1.4"/></svg>