buteName="opacity" values="0;0;1;1" keyTimes="0;.45;.5;1" dur="3.5s" repeatCount="indefinite"/></circle><text x="26" y="158" font-size="16" fill="#aab1b8">Local-first personal finance app with typed,</text><text x="26" y="182" font-size="16" fill="#aab1b8">validated data, decimal-safe maths and a</text><text x="26" y="206" font-size="16" fill="#aab1b8">containerised SQLite deployment.</text><text x="26" y="248" font-size="13" fill="#f5c842" letter-spacing="1.5">▸ LOCAL-FIRST · DECIMAL-SAFE · DOCKER</text><rect x="26" y="272" width="79" height="30" rx="4" fill="#0f141a" stroke="#2c3026"/><text x="65" y="292" font-size="13.5" fill="#e9e8d9" text-anchor="middle">Next.js</text><rect x="112.69999999999999" y="272" width="71" height="30" rx="4" fill="#0f141a" stroke="#2c3026"/><text x="148" y="292" font-size="13.5" fill="#e9e8d9" text-anchor="middle">SQLite</text><rect x="191.29999999999998" y="272" width="46" height="30" rx="4" fill="#0f141a" stroke="#2c3026"/><text x="214" y="292" font-size="13.5" fill="#e9e8d9" text-anchor="middle">Zod</text><rect x="245.59999999999997" y="272" width="71" height="30" rx="4" fill="#0f141a" stroke="#2c3026"/><text x="281" y="292" font-size="13.5" fill="#e9e8d9" text-anchor="middle">Docker</text><rect width="600" height="330" fill="url(#sl)"/></g><path d="M7 19V7H19M581 7H593V19M593 311V323H581M19 323H7V311" fill="none" stroke="#6c6032" stroke-width="1.4"/></svg>