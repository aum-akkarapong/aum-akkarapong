<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="t d"><title id="t">Finora</title><desc id="d">Local-first personal finance app with typed, validated data, decimal-safe maths and a containerised SQLite deployment. Stack: Next.js, SQLite, Zod, Docker.</desc><style>text{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace}
