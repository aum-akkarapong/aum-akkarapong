<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="t d"><title id="t">Core domains</title><desc id="d">Network engineering, defensive security and software engineering.</desc><style>text{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace}
