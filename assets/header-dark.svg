<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Akkarapong — Network Engineering, Defensive Security, Full-Stack Tooling. Bangkok, Thailand.">
  <style>
    .bg { fill: #000000; }
    .fg { fill: #ffffff; }
    .mute { fill: #8b8b8b; }
    .line { stroke: #ffffff; }
    .faint { stroke: #3a3a3a; }
    .sans { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="300" rx="14"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="none" class="faint" stroke-width="1"/>

  <text x="64" y="78" class="mono mute" font-size="14" letter-spacing="4">NETWORK  /  SECURITY  /  SOFTWARE</text>
  <text x="62" y="152" class="sans fg" font-size="68" font-weight="700" letter-spacing="2">AKKARAPONG</text>
  <line x1="64" y1="176" x2="200" y2="176" class="line" stroke-width="3"/>
  <text x="64" y="214" class="sans fg" font-size="22">Network Engineering · Defensive Security · Full-Stack Tooling</text>
  <text x="64" y="252" class="mono mute" font-size="15">Map the network. Read the packets. Ship the tools.   —   Bangkok, TH</text>

  <!-- minimal topology mark -->
  <g class="line" stroke-width="1.5" fill="none">
    <line x1="960" y1="80" x2="1060" y2="80"/>
    <line x1="960" y1="80" x2="910" y2="160"/>
    <line x1="960" y1="80" x2="1010" y2="160"/>
    <line x1="1060" y1="80" x2="1010" y2="160"/>
    <line x1="1060" y1="80" x2="1110" y2="160"/>
    <line x1="910" y1="160" x2="960" y2="230"/>
    <line x1="1010" y1="160" x2="960" y2="230"/>
    <line x1="1010" y1="160" x2="1060" y2="230"/>
    <line x1="1110" y1="160" x2="1060" y2="230"/>
  </g>
  <g class="fg">
    <rect x="950" y="70" width="20" height="20"/>
    <rect x="1050" y="70" width="20" height="20"/>
    <circle cx="910" cy="160" r="8"/>
    <circle cx="1010" cy="160" r="8"/>
    <circle cx="1110" cy="160" r="8"/>
    <circle cx="960" cy="230" r="6"/>
    <circle cx="1060" cy="230" r="6"/>
  </g>
</svg>
