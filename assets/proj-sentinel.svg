<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="t d"><title id="t">Sentinel PC</title><desc id="d">Real-time Windows system monitor: CPU, GPU, memory, disk and network metrics with a guarded process and service manager. Stack: Node.js, PowerShell, React, SQLite.</desc><style>text{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace}
